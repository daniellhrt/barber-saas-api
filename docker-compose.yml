version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barbersaas_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin # Senha simples para desenvolvimento local
      POSTGRES_DB: barbersaas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: