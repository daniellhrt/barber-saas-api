server:
  port: ${PORT:8080}

spring:
  application:
    name: barber-saas-api

  # Configurações de conexão com o PostgreSQL (credenciais via variáveis de ambiente)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbersaas_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  # Configurações do Spring Data JPA e Hibernate
  jpa:
    # ddl-auto como 'validate' garante que o Hibernate não altere as tabelas criadas pelo Flyway
    hibernate:
      ddl-auto: validate
    # show-sql apenas em dev — nunca em produção
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Configuração do Flyway para controle de versão do banco de dados
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configurações personalizadas da nossa aplicação (Segurança JWT)
api:
  security:
    token:
      secret: ${JWT_SECRET:change-me-in-production}
      expiration: ${JWT_EXPIRATION_MS:86400000}

# Configurações da aplicação
app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors:
    # Em produção: CORS_ALLOWED_ORIGINS=https://meuapp.com,https://outro.app.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator — health check público
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Logging
logging:
  level:
    root: INFO
    br.com.daniel.danbarbersaasapi: INFO
