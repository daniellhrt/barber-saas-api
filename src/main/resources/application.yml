server:
  port: ${PORT:8080}

spring:
  application:
    name: barber-saas-api

  # Configurações de conexão com o PostgreSQL rodando no Neon (Nuvem)
  datasource:
    url: jdbc:postgresql://ep-flat-voice-acnlajh4-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
    username: neondb_owner
    password: npg_kMoGY1Rse4Iz
    driver-class-name: org.postgresql.Driver

  # Configurações do Spring Data JPA e Hibernate
  jpa:
    # ddl-auto como 'validate' garante que o Hibernate não altere as tabelas criadas pelo Flyway
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Flyway para controle de versão do banco de dados
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configurações personalizadas da nossa aplicação (Segurança JWT)
api:
  security:
    token:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Chave secreta (Mude em produção ou use variável de ambiente)
      expiration: 86400000 # Tempo de expiração do token (Ex: 24 horas em milissegundos)